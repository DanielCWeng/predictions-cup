# FULLSTACK-002 forced-SHADOW guarded run (2026-10-01, authorized by Daniel).
[Service]
# Memory guard: MAKE is the preferred OOM victim and is capped at 400M.
MemoryMax=220M
OOMScoreAdjust=800
# Do not auto-restart after an abort/OOM kill during this guarded run.
Restart=no
# Enable the in-process composition (not set in runtime.env, so these apply).
Environment=PREDICTIONS_CUP_MAKER_ENABLED=true
Environment=PREDICTIONS_CUP_SHADOW_ENABLED=true
Environment=PREDICTIONS_CUP_LIVE_LEARN_ENABLED=false
Environment=PREDICTIONS_CUP_GLOBAL_KILL_SWITCH=true
# The stock ExecCondition rejects global_kill_switch=true; replace it with the same
# checks but REQUIRING kill=true (plus trading=false, mode=SHADOW, no trade credential).
ExecCondition=
ExecCondition=/home/ec2-user/predictions-cup/.venv/bin/python /home/ec2-user/.config/predictions-cup/fs002_shadow_killon_condition.py
