name: SIG command watch (GitHub-only)

on:
  schedule:
    # GitHub schedules are best-effort and can be delayed or skipped.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: sig-command-watch
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Capture GitHub-only command status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          def get(path):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "sig-command-watch-readonly",
                  },
              )
              with urllib.request.urlopen(req, timeout=12) as rsp:
                  return json.load(rsp)

          main = get(f"/repos/{repo}/commits/main")
          master = get(f"/repos/{repo}/issues/201")
          safety = get(f"/repos/{repo}/issues/207")
          prs = get(f"/repos/{repo}/pulls?state=open&per_page=100")
          runs = get(f"/repos/{repo}/actions/workflows/ci.yml/runs?branch=main&per_page=1")
          by_num = {p["number"]: p for p in prs}
          active = [(n, by_num[n]) for n in (202, 213, 218, 219, 223, 225, 228, 229, 232, 233, 234) if n in by_num]
          latest = runs.get("workflow_runs", [None])
          ci = latest[0] if latest else None
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          lines = [
              "## SIG GitHub-only command heartbeat",
              f"- Captured UTC: {now}",
              f"- Main SHA: `{main['sha'][:12]}`",
              f"- Master #201: {master['state']}; updated {master.get('updated_at')}",
              f"- Safety #207: {safety['state']}; updated {safety.get('updated_at')}",
              f"- Latest `main` CI: {ci.get('status', 'unknown') if ci else 'unknown'} / {ci.get('conclusion', 'unknown') if ci else 'unknown'} ({ci.get('html_url', 'not available') if ci else 'not available'})",
              f"- Open tracked PRs: {', '.join('#'+str(n)+(' [DRAFT]' if p['draft'] else '') for n,p in active) or 'none'}",
              "- Evidence boundary: GitHub state ONLY; LIVE host/account/venue data, capital headroom, and alpha economics NOT CHECKED.",
              "- Current command/handoff: [SIG_COMMAND.md](https://github.com/DanielCWeng/predictions-cup/blob/main/SIG_COMMAND.md) and master issue #201.",
              "- This workflow does not trade, deploy, modify issues, call SIG/PM, or create ChatGPT conversations.",
          ]
          text = "\n".join(lines) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf8") as out:
              out.write(text)
          PY
