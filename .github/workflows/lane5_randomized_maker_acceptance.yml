name: Lane 5 Randomized Offline Maker Acceptance

on:
  push:
    branches:
      - research/lane5-randomized-maker-acceptance-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  randomized-maker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install offline maker and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint offline benchmark (project source mypy runs in full CI)
        run: ruff check scripts/research/lane5_randomized_maker_acceptance.py
      - name: Pre-registered 24-pair randomized OFF/ON on real maker and fake sink
        shell: bash
        run: |
          set -o pipefail
          python scripts/research/lane5_randomized_maker_acceptance.py --seed 207220 --pairs 24 --iterations 1000 | tee lane5_randomized_maker.jsonl
      - name: Upload immutable runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: lane5-randomized-maker-controls
          path: lane5_randomized_maker.jsonl
