name: Kaggle Runner

on:
  push:
    paths:
      - "kaggle/jobs/**/*.json"
      - "scripts/kaggle_actions_runner.py"
      - ".github/workflows/kaggle-run.yml"
  workflow_dispatch:
    inputs:
      manifest:
        description: "Repository-relative Kaggle job manifest path"
        required: true
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.manifests.outputs.manifests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover requested manifests
        id: manifests
        env:
          MANUAL_MANIFEST: ${{ github.event.inputs.manifest }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manual = os.environ.get("MANUAL_MANIFEST", "").strip()
          if manual:
              paths = [manual]
          else:
              before = os.environ.get("BEFORE_SHA", "").strip()
              current = os.environ["GITHUB_SHA"]
              if before and set(before) != {"0"}:
                  changed = subprocess.check_output(
                      ["git", "diff", "--name-only", before, current],
                      text=True,
                  )
              else:
                  changed = subprocess.check_output(
                      ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", current],
                      text=True,
                  )
              paths = sorted(
                  {
                      path
                      for path in changed.splitlines()
                      if path.startswith("kaggle/jobs/") and path.endswith(".json")
                  }
              )

          for path in paths:
              candidate = Path(path)
              if not candidate.is_file():
                  raise SystemExit(f"Manifest does not exist: {path}")

          value = json.dumps(paths, separators=(",", ":"))
          print(f"Selected manifests: {value}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"manifests={value}\n")
          PY

  run:
    needs: discover
    if: needs.discover.outputs.manifests != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        manifest: ${{ fromJSON(needs.discover.outputs.manifests) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Run Kaggle job
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || {
            echo "::error::KAGGLE_API_TOKEN repository secret is missing"
            exit 1
          }
          python scripts/kaggle_actions_runner.py --manifest "${{ matrix.manifest }}"

      - name: Upload compact runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-run-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: kaggle/action-output/
          if-no-files-found: ignore
          retention-days: 3
