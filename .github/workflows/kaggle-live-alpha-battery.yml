
name: Kaggle Live Alpha Battery

on:
  push:
    branches:
      - analysis/live-alpha-battery-001
    paths:
      - "scripts/kaggle/live_alpha_battery_001/**"
      - ".github/workflows/kaggle-live-alpha-battery.yml"

permissions:
  contents: write

jobs:
  battery:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        lane: [maker_queue, residual_taker, microstructure, structural_rv, hazard]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install preflight and Kaggle dependencies
        run: python -m pip install --upgrade kaggle pandas numpy scikit-learn tabulate
      - name: Stage shared runner
        run: |
          DIR="scripts/kaggle/live_alpha_battery_001/${{ matrix.lane }}"
          cp scripts/kaggle/live_alpha_battery_001/common.py "$DIR/common.py"
      - name: Preflight lane
        env:
          LIVE_ALPHA_INPUT: data/kaggle_handoff/live_alpha_001/package
          LIVE_ALPHA_OUTPUT: /tmp/live-alpha-${{ matrix.lane }}
        run: python scripts/kaggle/live_alpha_battery_001/${{ matrix.lane }}/run.py
      - name: Push lane to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          DIR="scripts/kaggle/live_alpha_battery_001/$LANE"
          KERNEL="$(python -c "import json; print(json.load(open('$DIR/kernel-metadata.json'))['id'])")"
          kaggle kernels push -p "$DIR"
          for i in $(seq 1 240); do
            STATUS="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "$STATUS"
            LOWER="$(printf '%s' "$STATUS" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$LOWER" | grep -q complete; then
              mkdir -p "kaggle/battery/$LANE"
              kaggle kernels output "$KERNEL" -p "kaggle/battery/$LANE" --force
              exit 0
            fi
            if printf '%s' "$LOWER" | grep -Eq 'error|failed|cancel'; then
              kaggle kernels logs "$KERNEL" || true
              exit 1
            fi
            sleep 15
          done
          echo "Kaggle lane timed out"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-alpha-battery-${{ matrix.lane }}
          path: kaggle/battery/${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 3

  synthesize:
    needs: battery
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: live-alpha-battery-*
          path: lanes/live_alpha_battery_001
          merge-multiple: false
      - name: Synthesize battery
        run: python scripts/kaggle/live_alpha_battery_001/synthesize.py
      - name: Commit battery outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lanes/live_alpha_battery_001
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record live alpha battery outputs"
          git push
