name: DATA-004 unsafe lint cleanup

on:
  push:
    branches:
      - data/data004-ets-p0p1-fills
    paths:
      - .github/workflows/data004-unsafe-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/data004-ets-p0p1-fills
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.13.2
      - name: Apply remaining Ruff fixes
        run: |
          ruff check scripts/research/data004 --fix --unsafe-fixes || true
          ruff format scripts/research/data004
      - name: Commit changes
        run: |
          if git diff --quiet -- scripts/research/data004; then
            echo "No remaining automated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/research/data004
          git commit -m "style: finish DATA-004 lint cleanup"
          git push origin HEAD:data/data004-ets-p0p1-fills
