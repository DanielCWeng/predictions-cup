
name: Kaggle Session Inventory

on:
  push:
    branches:
      - analysis/live-alpha-battery-001
    paths:
      - ".github/workflows/kaggle-session-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle
        run: python -m pip install --upgrade kaggle
      - name: Inventory recent kernels
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels list --mine --page-size 100 --csv > /tmp/kernels.csv
          cat /tmp/kernels.csv
          echo "=== ACTIVE / QUEUED STATUS ==="
          python - <<'PY'
import csv, subprocess
rows=list(csv.DictReader(open('/tmp/kernels.csv')))
for row in rows[:100]:
    ref=row.get('ref') or row.get('Ref') or next(iter(row.values()))
    if not ref: continue
    p=subprocess.run(['kaggle','kernels','status',ref],text=True,capture_output=True)
    s=(p.stdout+p.stderr).strip()
    low=s.lower()
    if 'running' in low or 'queued' in low:
        print(ref, '=>', s)
PY
