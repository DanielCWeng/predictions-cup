
name: Kaggle Session Inventory

on:
  push:
    branches:
      - analysis/live-alpha-battery-001
    paths:
      - ".github/workflows/kaggle-session-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kaggle
        run: python -m pip install --upgrade kaggle
      - name: Inventory recent kernels
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle kernels list --mine --page-size 100 --csv > /tmp/kernels.csv
          echo "=== RECENT KERNELS ==="
          head -40 /tmp/kernels.csv
          echo "=== ACTIVE / QUEUED STATUS ==="
          tail -n +2 /tmp/kernels.csv | cut -d, -f1 | head -100 | while IFS= read -r ref; do
            status="$(kaggle kernels status "$ref" 2>&1 || true)"
            lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$lower" | grep -Eq 'running|queued'; then
              echo "$ref => $status"
            fi
          done
