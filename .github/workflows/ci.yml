name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Shell validation
        run: |
          bash -n scripts/install_runtime_services.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/install_runtime_services.sh
          fi

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

      - name: Application smoke
        run: |
          python -m predictions_cup.app
          python -m predictions_cup.app --smoke-test

      - name: BUILD-009 benchmark smoke
        run: python -m predictions_cup.benchmarks --smoke

      - name: MAKE-001 benchmark smoke
        run: python scripts/benchmark_make001.py --iterations 20 --bursts 1 --journal-iterations 2

      - name: MAKE-001 benchmark full
        run: python scripts/benchmark_make001.py --iterations 20000 --bursts 100 --journal-iterations 200

      - name: MAKE-001 service smoke
        run: python -m predictions_cup.maker --smoke-test

      - name: CANDIDATE-RUNTIME-001 benchmark
        run: python scripts/benchmark_candidate_runtime001.py --markets 237 --bursts 20

      - name: SHADOW-002 benchmark
        run: python scripts/benchmark_shadow002.py --markets 237 --candidates 6 --persistence-events 32

      - name: SHADOW-002 sustained persistence soak
        run: python scripts/soak_shadow002.py --markets 237 --candidates 6 --cycles 20 --cycle-pause-ms 500

      - name: LIVE-LEARN-001 237-market burst
        run: python scripts/benchmark_live_learn001.py --markets 237 --candidates 6
