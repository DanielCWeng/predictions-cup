name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Shell validation
        run: |
          bash -n scripts/install_runtime_services.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/install_runtime_services.sh
          fi

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

      - name: Application smoke
        run: |
          python -m predictions_cup.app
          python -m predictions_cup.app --smoke-test

      - name: BUILD-009 benchmark smoke
        run: python -m predictions_cup.benchmarks --smoke

      - name: MAKE-001 benchmark smoke
        run: python scripts/benchmark_make001.py --iterations 20 --bursts 1 --journal-iterations 2
