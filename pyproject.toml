[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "predictions-cup"
version = "0.1.0"
description = "Foundation for a quantitative prediction-market trading system."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Predictions Cup Team" }]
dependencies = [
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/predictions_cup"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
